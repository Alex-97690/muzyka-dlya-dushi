<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AlexCut — Видеоредактор</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#0b0b0f;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
}

header{
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  background:#15151c;
  border-bottom:1px solid #292932;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.logo span{
  color:#8b5cf6;
}

.exportTop{
  background:#8b5cf6;
  border:0;
  color:white;
  padding:10px 16px;
  border-radius:10px;
  font-weight:bold;
}

.app{
  display:flex;
  min-height:calc(100vh - 58px);
}

.sidebar{
  width:82px;
  background:#121219;
  border-right:1px solid #292932;
  display:flex;
  flex-direction:column;
  padding:8px 5px;
  gap:5px;
}

.tool{
  border:0;
  background:transparent;
  color:#aaa;
  padding:10px 2px;
  border-radius:10px;
  font-size:11px;
}

.tool.active,
.tool:active{
  background:#272035;
  color:#fff;
}

.toolIcon{
  display:block;
  font-size:23px;
  margin-bottom:4px;
}

.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.preview{
  height:48vh;
  min-height:280px;
  background:#050507;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  overflow:hidden;
}

.videoWrap{
  position:relative;
  max-width:92%;
  max-height:92%;
  display:flex;
  justify-content:center;
  align-items:center;
}

#video{
  max-width:100%;
  max-height:42vh;
  display:none;
  transform-origin:center center;
  background:#000;
}

#empty{
  text-align:center;
  color:#777;
}

#empty .big{
  font-size:55px;
  margin-bottom:10px;
}

#textOverlay{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-size:28px;
  font-weight:bold;
  color:white;
  text-shadow:0 2px 5px #000;
  display:none;
  pointer-events:none;
  white-space:nowrap;
}

.controls{
  height:52px;
  background:#121219;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  border-top:1px solid #292932;
  border-bottom:1px solid #292932;
}

.controlBtn{
  width:42px;
  height:38px;
  border:0;
  border-radius:10px;
  background:#25252e;
  color:#fff;
  font-size:18px;
}

.time{
  font-size:12px;
  color:#aaa;
  min-width:110px;
  text-align:center;
}

.panel{
  padding:12px;
  background:#15151c;
  border-bottom:1px solid #292932;
  display:none;
}

.panel.active{
  display:block;
}

.panel h3{
  margin:0 0 12px;
  font-size:16px;
}

.row{
  display:flex;
  align-items:center;
  gap:10px;
  margin:10px 0;
}

.row label{
  width:80px;
  font-size:13px;
  color:#aaa;
}

input[type="range"]{
  flex:1;
  accent-color:#8b5cf6;
}

input[type="text"],
input[type="number"]{
  width:100%;
  background:#24242d;
  color:#fff;
  border:1px solid #383842;
  padding:10px;
  border-radius:8px;
  outline:none;
}

.action{
  border:0;
  background:#8b5cf6;
  color:white;
  padding:10px 15px;
  border-radius:9px;
  font-weight:bold;
}

.secondary{
  background:#292932;
}

.timeline{
  background:#0d0d12;
  padding:10px;
  overflow:hidden;
}

.timelineHeader{
  display:flex;
  justify-content:space-between;
  color:#888;
  font-size:11px;
  margin-bottom:7px;
}

.track{
  height:54px;
  background:#191921;
  border-radius:8px;
  position:relative;
  overflow:hidden;
  border:1px solid #292932;
}

.clip{
  position:absolute;
  top:7px;
  bottom:7px;
  left:0;
  right:0;
  background:linear-gradient(90deg,#5b21b6,#8b5cf6);
  border-radius:6px;
}

.handle{
  position:absolute;
  top:0;
  bottom:0;
  width:20px;
  background:#fff;
  z-index:4;
  touch-action:none;
}

.handle.left{
  left:0;
  border-radius:6px 0 0 6px;
}

.handle.right{
  right:0;
  border-radius:0 6px 6px 0;
}

.handle:after{
  content:"";
  position:absolute;
  top:19px;
  left:7px;
  width:5px;
  height:16px;
  background:#8b5cf6;
  border-radius:3px;
}

.playhead{
  position:absolute;
  top:0;
  bottom:0;
  width:2px;
  background:#ff3b81;
  left:0;
  z-index:5;
  pointer-events:none;
}

.trackLabel{
  font-size:10px;
  color:#888;
  margin:7px 0 3px;
}

.uploadArea{
  border:1px dashed #555565;
  border-radius:10px;
  padding:14px;
  text-align:center;
  margin-bottom:10px;
}

.uploadArea input{
  display:none;
}

.uploadButton{
  display:inline-block;
  padding:10px 14px;
  background:#8b5cf6;
  border-radius:8px;
  font-weight:bold;
}

.filters{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.filterBtn{
  background:#292932;
  color:#fff;
  border:0;
  padding:9px 12px;
  border-radius:8px;
}

.filterBtn.active{
  background:#8b5cf6;
}

.bottomInfo{
  padding:8px 12px;
  color:#666;
  font-size:11px;
  text-align:center;
}

@media(max-width:700px){
  .sidebar{
    width:70px;
  }

  .preview{
    height:38vh;
    min-height:230px;
  }

  #video{
    max-height:34vh;
  }

  .tool{
    font-size:10px;
  }

  .toolIcon{
    font-size:20px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">Alex<span>Cut</span></div>
  <button class="exportTop" onclick="exportVideo()">💾 Экспорт</button>
</header>

<div class="app">

  <aside class="sidebar">

    <button class="tool active" onclick="openPanel('videoPanel',this)">
      <span class="toolIcon">🎬</span>
      Видео
    </button>

    <button class="tool" onclick="openPanel('trimPanel',this)">
      <span class="toolIcon">✂️</span>
      Обрезка
    </button>

    <button class="tool" onclick="openPanel('musicPanel',this)">
      <span class="toolIcon">🎵</span>
      Музыка
    </button>

    <button class="tool" onclick="openPanel('textPanel',this)">
      <span class="toolIcon">📝</span>
      Текст
    </button>

    <button class="tool" onclick="openPanel('effectsPanel',this)">
      <span class="toolIcon">🎨</span>
      Эффекты
    </button>

    <button class="tool" onclick="openPanel('transformPanel',this)">
      <span class="toolIcon">🔄</span>
      Вид
    </button>

    <button class="tool" onclick="openPanel('aiPanel',this)">
      <span class="toolIcon">🤖</span>
      AI
    </button>

  </aside>

  <main class="main">

    <section class="preview">

      <div class="videoWrap">

        <div id="empty">
          <div class="big">🎬</div>
          <div>Загрузи видео</div>
        </div>

        <video id="video" playsinline></video>

        <div id="textOverlay"></div>

      </div>

    </section>

    <section class="controls">

      <button class="controlBtn" onclick="video.currentTime=Math.max(startTime,video.currentTime-5)">⏮</button>

      <button class="controlBtn" id="playBtn" onclick="togglePlay()">▶️</button>

      <button class="controlBtn" onclick="video.currentTime=Math.min(endTime,video.currentTime+5)">⏭</button>

      <div class="time">
        <span id="currentTime">00:00</span>
        /
        <span id="duration">00:00</span>
      </div>

    </section>

    <!-- VIDEO -->

    <section id="videoPanel" class="panel active">

      <h3>🎬 Видео</h3>

      <div class="uploadArea">

        <label class="uploadButton">
          📁 Выбрать видео
          <input type="file" id="videoInput" accept="video/*">
        </label>

      </div>

      <div id="fileName" class="bottomInfo">
        Видео пока не выбрано
      </div>

    </section>

    <!-- TRIM -->

    <section id="trimPanel" class="panel">

      <h3>✂️ Обрезка</h3>

      <div class="row">
        <label>Начало</label>
        <span id="startLabel">00:00</span>
      </div>

      <div class="row">
        <label>Конец</label>
        <span id="endLabel">00:00</span>
      </div>

      <button class="action secondary" onclick="resetTrim()">
        ↩️ Сбросить обрезку
      </button>

    </section>

    <!-- MUSIC -->

    <section id="musicPanel" class="panel">

      <h3>🎵 Музыка</h3>

      <div class="uploadArea">

        <label class="uploadButton">
          🎵 Добавить музыку
          <input type="file" id="musicInput" accept="audio/*">
        </label>

      </div>

      <div id="musicName" class="bottomInfo">
        Музыка не добавлена
      </div>

      <div class="row">
        <label>Громкость</label>
        <input id="musicVolume" type="range" min="0" max="1" step="0.01" value="1">
      </div>

    </section>

    <!-- TEXT -->

    <section id="textPanel" class="panel">

      <h3>📝 Текст</h3>

      <input
        id="textInput"
        type="text"
        placeholder="Напиши текст..."
        oninput="updateText()"
      >

      <div class="row">
        <label>Размер</label>
        <input
          id="textSize"
          type="range"
          min="12"
          max="80"
          value="28"
          oninput="updateText()"
        >
      </div>

      <button class="action secondary" onclick="clearText()">
        Удалить текст
      </button>

    </section>

    <!-- EFFECTS -->

    <section id="effectsPanel" class="panel">

      <h3>🎨 Фильтры</h3>

      <div class="filters">

        <button class="filterBtn active" onclick="setFilter('none',this)">
          Оригинал
        </button>

        <button class="filterBtn" onclick="setFilter('grayscale(1)',this)">
          Ч/Б
        </button>

        <button class="filterBtn" onclick="setFilter('sepia(1)',this)">
          Сепия
        </button>

        <button class="filterBtn" onclick="setFilter('contrast(1.5)',this)">
          Контраст
        </button>

        <button class="filterBtn" onclick="setFilter('brightness(1.4)',this)">
          Яркость
        </button>

        <button class="filterBtn" onclick="setFilter('saturate(2)',this)">
          Цвет
        </button>

        <button class="filterBtn" onclick="setFilter('blur(3px)',this)">
          Размытие
        </button>

      </div>

    </section>

    <!-- TRANSFORM -->

    <section id="transformPanel" class="panel">

      <h3>🔄 Поворот и масштаб</h3>

      <div class="row">

        <button class="action secondary" onclick="rotateVideo(-90)">
          ↶ 90°
        </button>

        <button class="action secondary" onclick="rotateVideo(90)">
          ↷ 90°
        </button>

        <button class="action secondary" onclick="resetTransform()">
          Сброс
        </button>

      </div>

      <div class="row">
        <label>Масштаб</label>
        <input
          id="scaleRange"
          type="range"
          min="0.5"
          max="2"
          step="0.01"
          value="1"
          oninput="updateTransform()"
        >
      </div>

      <div class="row">
        <label>Громкость</label>
        <input
          id="volumeRange"
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="1"
          oninput="video.volume=this.value"
        >
      </div>

    </section>

    <!-- AI -->

    <section id="aiPanel" class="panel">

      <h3>🤖 AI</h3>

      <p style="color:#aaa;font-size:13px;">
        AI-инструменты подключим следующим этапом.
      </p>

      <button class="action secondary" onclick="alert('AI-субтитры будут добавлены в следующей версии AlexCut.')">
        ✨ Автоматические субтитры
      </button>

      <button class="action secondary" onclick="alert('AI-удаление фона будет добавлено позже.')">
        🪄 Удалить фон
      </button>

    </section>

    <!-- TIMELINE -->

    <section class="timeline">

      <div class="timelineHeader">
        <span>ТАЙМЛАЙН</span>
        <span id="timelineDuration">00:00</span>
      </div>

      <div class="trackLabel">🎬 Видео 1</div>

      <div class="track" id="videoTrack">

        <div class="clip" id="clip">

          <div
            class="handle left"
            id="leftHandle">
          </div>

          <div
            class="handle right"
            id="rightHandle">
          </div>

        </div>

        <div
          class="playhead"
          id="playhead">
        </div>

      </div>

      <div class="trackLabel">🎵 Музыка 1</div>

      <div class="track">
        <div
          class="clip"
          style="background:linear-gradient(90deg,#075985,#0ea5e9);">
        </div>
      </div>

      <div class="trackLabel">📝 Текст 1</div>

      <div class="track">
        <div
          class="clip"
          style="background:linear-gradient(90deg,#9f1239,#f43f5e);">
        </div>
      </div>

    </section>

  </main>

</div>

<script>

const video = document.getElementById("video");
const empty = document.getElementById("empty");
const playBtn = document.getElementById("playBtn");
const currentTimeEl = document.getElementById("currentTime");
const durationEl = document.getElementById("duration");
const timelineDuration = document.getElementById("timelineDuration");
const playhead = document.getElementById("playhead");

const leftHandle = document.getElementById("leftHandle");
const rightHandle = document.getElementById("rightHandle");
const clip = document.getElementById("clip");
const videoTrack = document.getElementById("videoTrack");

let startTime = 0;
let endTime = 0;
let rotation = 0;
let scale = 1;
let music = null;
let musicURL = null;

const audio = new Audio();
audio.loop = false;

function openPanel(id, button){

  document.querySelectorAll(".panel").forEach(panel=>{
    panel.classList.remove("active");
  });

  document.getElementById(id).classList.add("active");

  document.querySelectorAll(".tool").forEach(tool=>{
    tool.classList.remove("active");
  });

  button.classList.add("active");
}

function formatTime(seconds){

  if(!isFinite(seconds)) return "00:00";

  seconds = Math.max(0,seconds);

  const minutes = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);

  return String(minutes).padStart(2,"0") + ":" +
         String(secs).padStart(2,"0");
}

document.getElementById("videoInput").addEventListener("change",function(){

  const file = this.files[0];

  if(!file) return;

  const url = URL.createObjectURL(file);

  video.src = url;
  video.style.display = "block";
  empty.style.display = "none";

  document.getElementById("fileName").textContent = file.name;

  video.load();

});

video.addEventListener("loadedmetadata",function(){

  endTime = video.duration;

  startTime = 0;

  durationEl.textContent = formatTime(video.duration);
  timelineDuration.textContent = formatTime(video.duration);

  document.getElementById("startLabel").textContent =
    formatTime(startTime);

  document.getElementById("endLabel").textContent =
    formatTime(endTime);

  updateHandles();

});

video.addEventListener("timeupdate",function(){

  currentTimeEl.textContent = formatTime(video.currentTime);

  if(video.currentTime >= endTime && !video.paused){

    video.pause();
    video.currentTime = startTime;

  }

  updatePlayhead();

});

function togglePlay(){

  if(!video.src){

    alert("Сначала загрузи видео.");

    return;
  }

  if(video.paused){

    if(video.currentTime < startTime ||
       video.currentTime >= endTime){

      video.currentTime = startTime;

    }

    video.play();

    if(music){
      audio.currentTime = Math.max(0,video.currentTime-startTime);
      audio.play().catch(()=>{});
    }

    playBtn.textContent = "⏸";

  }else{

    video.pause();
    audio.pause();

    playBtn.textContent = "▶️";

  }

}

video.addEventListener("pause",()=>{
  playBtn.textContent = "▶️";
});

video.addEventListener("play",()=>{
  playBtn.textContent = "⏸";
});

function updatePlayhead(){

  if(!video.duration) return;

  const percent =
    (video.currentTime / video.duration) * 100;

  playhead.style.left = percent + "%";

}

function updateHandles(){

  if(!video.duration) return;

  const left =
    (startTime / video.duration) * 100;

  const right =
    (endTime / video.duration) * 100;

  clip.style.left = left + "%";
  clip.style.right = (100-right) + "%";

  document.getElementById("startLabel").textContent =
    formatTime(startTime);

  document.getElementById("endLabel").textContent =
    formatTime(endTime);

}

function pointerToTime(clientX){

  const rect = videoTrack.getBoundingClientRect();

  let percent =
    (clientX - rect.left) / rect.width;

  percent = Math.max(0,Math.min(1,percent));

  return percent * video.duration;

}

function dragHandle(handle,type){

  function move(e){

    const point =
      e.touches ? e.touches[0] : e;

    const time =
      pointerToTime(point.clientX);

    if(type === "left"){

      startTime =
        Math.max(0,Math.min(time,endTime-0.1));

      if(video.currentTime < startTime){

        video.currentTime = startTime;

      }

    }else{

      endTime =
        Math.min(video.duration,
          Math.max(time,startTime+0.1));

      if(video.currentTime > endTime){

        video.currentTime = endTime;

      }

    }

    updateHandles();
    updatePlayhead();

  }

  function stop(){

    document.removeEventListener("mousemove",move);
    document.removeEventListener("mouseup",stop);

    document.removeEventListener("touchmove",move);
    document.removeEventListener("touchend",stop);

  }

  document.addEventListener("mousemove",move);
  document.addEventListener("mouseup",stop);

  document.addEventListener("touchmove",move,{passive:false});
  document.addEventListener("touchend",stop);

}

leftHandle.addEventListener("mousedown",e=>{
  e.preventDefault();
  dragHandle(leftHandle,"left");
});

rightHandle.addEventListener("mousedown",e=>{
  e.preventDefault();
  dragHandle(rightHandle,"right");
});

leftHandle.addEventListener("touchstart",e=>{
  e.preventDefault();
  dragHandle(leftHandle,"left");
},{passive:false});

rightHandle.addEventListener("touchstart",e=>{
  e.preventDefault();
  dragHandle(rightHandle,"right");
},{passive:false});

videoTrack.addEventListener("click",function(e){

  if(e.target.classList.contains("handle")) return;

  if(!video.duration) return;

  video.currentTime =
    pointerToTime(e.clientX);

});

function resetTrim(){

  if(!video.duration) return;

  startTime = 0;
  endTime = video.duration;

  updateHandles();

}

document.getElementById("musicInput")
.addEventListener("change",function(){

  const file = this.files[0];

  if(!file) return;

  musicURL = URL.createObjectURL(file);

  audio.src = musicURL;

  music = true;

  document.getElementById("musicName").textContent =
    file.name;

});

document.getElementById("musicVolume")
.addEventListener("input",function(){

  audio.volume = this.value;

});

function updateText(){

  const text =
    document.getElementById("textInput").value;

  const size =
    document.getElementById("textSize").value;

  const overlay =
    document.getElementById("textOverlay");

  overlay.textContent = text;

  overlay.style.fontSize = size + "px";

  overlay.style.display =
    text ? "block" : "none";

}

function clearText(){

  document.getElementById("textInput").value = "";

  updateText();

}

function setFilter(filter,button){

  video.style.filter = filter;

  document.querySelectorAll(".filterBtn")
    .forEach(btn=>btn.classList.remove("active"));

  button.classList.add("active");

}

function rotateVideo(degrees){

  rotation += degrees;

  updateTransform();

}

function updateTransform(){

  scale =
    document.getElementById("scaleRange").value;

  video.style.transform =
    "rotate(" + rotation + "deg) scale(" + scale + ")";

}

function resetTransform(){

  rotation = 0;
  scale = 1;

  document.getElementById("scaleRange").value = 1;

  updateTransform();

}

function exportVideo(){

  if(!video.src){

    alert("Сначала загрузите видео.");

    return;

  }

  alert(
    "Экспорт готовим следующим этапом. Сейчас AlexCut уже умеет загружать видео, проигрывать его и обрезать пальцами на таймлайне."
  );

}

</script>

</body>
</html>
