<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlexCut — видеоредактор</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
}

header {
    height: 60px;
    background: #181818;
    display: flex;
    align-items: center;
    padding: 0 20px;
    border-bottom: 1px solid #333;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.logo span {
    color: #8b5cf6;
}

.editor {
    display: flex;
    height: calc(100vh - 60px);
}

.sidebar {
    width: 90px;
    background: #181818;
    border-right: 1px solid #333;
    padding-top: 15px;
}

.tool {
    padding: 18px 5px;
    text-align: center;
    cursor: pointer;
    color: #aaa;
    font-size: 12px;
}

.tool:hover {
    background: #292929;
    color: white;
}

.tool-icon {
    font-size: 24px;
    display: block;
    margin-bottom: 5px;
}

.workspace {
    flex: 1;
    display: flex;
    flex-direction: column;
}

.preview {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0b0b0b;
    padding: 20px;
}

.video-box {
    width: 500px;
    height: 300px;
    background: #202020;
    border: 2px dashed #444;
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

video {
    max-width: 100%;
    max-height: 100%;
    display: none;
    border-radius: 10px;
}

.upload {
    text-align: center;
}

.upload button {
    margin-top: 15px;
    padding: 12px 25px;
    border: none;
    border-radius: 8px;
    background: #8b5cf6;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.timeline {
    height: 180px;
    background: #181818;
    border-top: 1px solid #333;
    padding: 20px;
}

.timeline-title {
    color: #aaa;
    margin-bottom: 15px;
}

.track {
    height: 70px;
    background: #252525;
    border-radius: 8px;
    position: relative;
}

.track-line {
    position: absolute;
    top: 0;
    left: 30%;
    width: 3px;
    height: 100%;
    background: #8b5cf6;
}
</style>
</head>

<body>

<header>
    <div class="logo">Alex<span>Cut</span> 🎬</div>
</header>

<div class="editor">

    <div class="sidebar">

        <div class="tool">
            <span class="tool-icon">🎬</span>
            Видео
        </div>

        <div class="tool">
            <span class="tool-icon">✂️</span>
            Обрезка
        </div>

        <div class="tool">
            <span class="tool-icon">🎵</span>
            Музыка
        </div>

        <div class="tool">
            <span class="tool-icon">📝</span>
            Текст
        </div>

        <div class="tool">
            <span class="tool-icon">✨</span>
            Эффекты
        </div>

        <div class="tool">
            <span class="tool-icon">🤖</span>
            AI
        </div>

    </div>

    <div class="workspace">

        <div class="preview">

            <div class="video-box">

                <div class="upload" id="uploadBox">
                    <div style="font-size:50px;">🎥</div>
                    <h2>Добавь своё видео</h2>
                    <p>Начни создавать свой первый проект</p>

                    <button onclick="document.getElementById('videoInput').click()">
                        + Добавить видео
                    </button>

                    <input
                        type="file"
                        id="videoInput"
                        accept="video/*"
                        hidden
                    >
                </div>

                <video id="videoPlayer" controls></video>

            </div>

        </div>

        <div class="timeline">

            <div class="timeline-title">
                Таймлайн
            </div>

            <div class="track">
                <div class="track-line"></div>
            </div>

        </div>

    </div>

</div>

<script>

const videoInput = document.getElementById("videoInput");
const videoPlayer = document.getElementById("videoPlayer");
const uploadBox = document.getElementById("uploadBox");

videoInput.addEventListener("change", function() {

    const file = this.files[0];

    if (!file) return;

    const videoURL = URL.createObjectURL(file);

    videoPlayer.src = videoURL;

    uploadBox.style.display = "none";
    videoPlayer.style.display = "block";

});

</script>

</body>
</html>
