<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AlexCut — видеоредактор</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0f0f0f;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    height: 60px;
    background: #181818;
    display: flex;
    align-items: center;
    padding: 0 20px;
    border-bottom: 1px solid #333;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.logo span {
    color: #8b5cf6;
}

.editor {
    display: flex;
    height: calc(100vh - 60px);
}

.sidebar {
    width: 90px;
    background: #181818;
    border-right: 1px solid #333;
    padding-top: 10px;
}

.tool {
    padding: 15px 5px;
    text-align: center;
    color: #aaa;
    cursor: pointer;
    font-size: 12px;
}

.tool:hover {
    background: #292929;
    color: white;
}

.tool-icon {
    display: block;
    font-size: 23px;
    margin-bottom: 5px;
}

.workspace {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.preview {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #090909;
    padding: 20px;
    min-height: 300px;
}

.video-box {
    width: min(700px, 90%);
    height: min(420px, 60vh);
    background: #202020;
    border: 2px dashed #444;
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: none;
}

.upload {
    text-align: center;
}

.upload-icon {
    font-size: 55px;
}

.upload button,
.main-button {
    margin-top: 15px;
    padding: 12px 24px;
    border: 0;
    border-radius: 8px;
    background: #8b5cf6;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.upload button:hover,
.main-button:hover {
    background: #7046d8;
}

.controls {
    background: #181818;
    padding: 15px 20px;
    border-top: 1px solid #333;
}

.time-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    color: #aaa;
    font-size: 14px;
}

#timeline {
    width: 100%;
    accent-color: #8b5cf6;
}

.trim-panel {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-top: 15px;
}

.trim-panel label {
    color: #aaa;
}

.trim-panel input {
    width: 90px;
    padding: 9px;
    border-radius: 6px;
    border: 1px solid #444;
    background: #252525;
    color: white;
}

.play-button {
    padding: 9px 18px;
    border: 0;
    border-radius: 7px;
    background: #333;
    color: white;
    cursor: pointer;
}

.play-button:hover {
    background: #444;
}

.timeline-area {
    height: 150px;
    background: #151515;
    border-top: 1px solid #333;
    padding: 20px;
}

.timeline-title {
    color: #aaa;
    margin-bottom: 12px;
}

.track {
    height: 65px;
    background: #252525;
    border-radius: 8px;
    position: relative;
    overflow: hidden;
}

.track-fill {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 0%;
    background: #6d45c7;
    opacity: 0.45;
}

#exportButton {
    background: #16a34a;
}

#exportButton:hover {
    background: #15803d;
}

.status {
    margin-top: 10px;
    color: #aaa;
    font-size: 13px;
}

@media (max-width: 600px) {

    .sidebar {
        width: 70px;
    }

    .tool {
        font-size: 10px;
        padding: 12px 2px;
    }

    .tool-icon {
        font-size: 20px;
    }

    .video-box {
        height: 300px;
        width: 95%;
    }

    .preview {
        padding: 10px;
    }

    .controls {
        padding: 12px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">
        Alex<span>Cut</span> 🎬
    </div>
</header>

<div class="editor">

    <div class="sidebar">

        <div class="tool">
            <span class="tool-icon">🎬</span>
            Видео
        </div>

        <div class="tool">
            <span class="tool-icon">✂️</span>
            Обрезка
        </div>

        <div class="tool">
            <span class="tool-icon">🎵</span>
            Музыка
        </div>

        <div class="tool">
            <span class="tool-icon">📝</span>
            Текст
        </div>

        <div class="tool">
            <span class="tool-icon">✨</span>
            Эффекты
        </div>

        <div class="tool">
            <span class="tool-icon">🤖</span>
            AI
        </div>

    </div>

    <div class="workspace">

        <div class="preview">

            <div class="video-box">

                <div class="upload" id="uploadBox">

                    <div class="upload-icon">🎥</div>

                    <h2>Добавь своё видео</h2>

                    <p>Начни создавать свой первый проект</p>

                    <button id="addVideoButton">
                        + Добавить видео
                    </button>

                    <input
                        type="file"
                        id="videoInput"
                        accept="video/*"
                        hidden
                    >

                </div>

                <video id="videoPlayer" controls></video>

            </div>

        </div>

        <div class="controls">

            <div class="time-row">
                <span id="currentTime">00:00</span>
                <span id="duration">00:00</span>
            </div>

            <input
                type="range"
                id="timeline"
                min="0"
                max="0"
                value="0"
                step="0.01"
            >

            <div style="margin-top:12px">

                <button
                    class="play-button"
                    id="playButton"
                >
                    ▶️ Воспроизвести
                </button>

            </div>

            <div class="trim-panel">

                <label>Начало:</label>

                <input
                    type="number"
                    id="startTime"
                    min="0"
                    value="0"
                    step="0.1"
                >

                <label>Конец:</label>

                <input
                    type="number"
                    id="endTime"
                    min="0"
                    value="0"
                    step="0.1"
                >

                <button
                    class="main-button"
                    id="trimButton"
                >
                    ✂️ Применить обрезку
                </button>

                <button
                    class="main-button"
                    id="exportButton"
                >
                    💾 Экспорт видео
                </button>

            </div>

            <div class="status" id="status">
                Готово к работе
            </div>

        </div>

        <div class="timeline-area">

            <div class="timeline-title">
                🎞️ Таймлайн
            </div>

            <div class="track">

                <div
                    class="track-fill"
                    id="trackFill"
                ></div>

            </div>

        </div>

    </div>

</div>

<script>

const videoInput = document.getElementById("videoInput");
const addVideoButton = document.getElementById("addVideoButton");
const videoPlayer = document.getElementById("videoPlayer");
const uploadBox = document.getElementById("uploadBox");

const timeline = document.getElementById("timeline");
const currentTimeText = document.getElementById("currentTime");
const durationText = document.getElementById("duration");

const playButton = document.getElementById("playButton");

const startTimeInput = document.getElementById("startTime");
const endTimeInput = document.getElementById("endTime");

const trimButton = document.getElementById("trimButton");
const exportButton = document.getElementById("exportButton");

const trackFill = document.getElementById("trackFill");
const status = document.getElementById("status");

let videoDuration = 0;
let trimStart = 0;
let trimEnd = 0;
let videoFile = null;

function formatTime(seconds) {

    if (!isFinite(seconds)) {
        return "00:00";
    }

    const minutes = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);

    return String(minutes).padStart(2, "0") +
        ":" +
        String(secs).padStart(2, "0");
}

addVideoButton.addEventListener("click", function() {
    videoInput.click();
});

videoInput.addEventListener("change", function() {

    const file = this.files[0];

    if (!file) {
        return;
    }

    videoFile = file;

    const videoURL = URL.createObjectURL(file);

    videoPlayer.src = videoURL;

    uploadBox.style.display = "none";
    videoPlayer.style.display = "block";

    status.textContent = "Видео загружено ✅";

    videoPlayer.load();
});

videoPlayer.addEventListener("loadedmetadata", function() {

    videoDuration = videoPlayer.duration;

    trimStart = 0;
    trimEnd = videoDuration;

    timeline.max = videoDuration;
    timeline.value = 0;

    startTimeInput.max = videoDuration;
    endTimeInput.max = videoDuration;

    startTimeInput.value = "0";
    endTimeInput.value = videoDuration.toFixed(1);

    durationText.textContent = formatTime(videoDuration);

    status.textContent = "Видео готово к редактированию ✅";
});

videoPlayer.addEventListener("timeupdate", function() {

    timeline.value = videoPlayer.currentTime;

    currentTimeText.textContent =
        formatTime(videoPlayer.currentTime);

    if (videoDuration > 0) {

        const percent =
            (videoPlayer.currentTime / videoDuration) * 100;

        trackFill.style.width = percent + "%";
    }

    if (
        trimEnd > trimStart &&
        videoPlayer.currentTime >= trimEnd
    ) {

        videoPlayer.pause();

        videoPlayer.currentTime = trimStart;

        playButton.textContent = "▶️ Воспроизвести";
    }
});

timeline.addEventListener("input", function() {

    videoPlayer.currentTime = Number(this.value);

});

playButton.addEventListener("click", function() {

    if (!videoPlayer.src) {
        alert("Сначала добавь видео.");
        return;
    }

    if (videoPlayer.paused) {

        if (videoPlayer.currentTime < trimStart ||
            videoPlayer.currentTime >= trimEnd) {

            videoPlayer.currentTime = trimStart;
        }

        videoPlayer.play();

        playButton.textContent = "⏸️ Пауза";

    } else {

        videoPlayer.pause();

        playButton.textContent = "▶️ Воспроизвести";
    }

});

startTimeInput.addEventListener("change", function() {

    let value = Number(this.value);

    if (value < 0) {
        value = 0;
    }

    if (value >= trimEnd) {
        value = Math.max(0, trimEnd - 0.1);
    }

    trimStart = value;

    this.value = value.toFixed(1);

});

endTimeInput.addEventListener("change", function() {

    let value = Number(this.value);

    if (value > videoDuration) {
        value = videoDuration;
    }

    if (value <= trimStart) {
        value = Math.min(videoDuration, trimStart + 0.1);
    }

    trimEnd = value;

    this.value = value.toFixed(1);

});

trimButton.addEventListener("click", function() {

    if (!videoPlayer.src) {

        alert("Сначала добавь видео.");

        return;
    }

    trimStart = Number(startTimeInput.value);
    trimEnd = Number(endTimeInput.value);

    if (trimStart >= trimEnd) {

        alert("Начало должно быть меньше конца.");

        return;
    }

    videoPlayer.currentTime = trimStart;

    status.textContent =
        "Обрезка установлена: " +
        formatTime(trimStart) +
        " — " +
        formatTime(trimEnd) +
        " ✂️";

});

exportButton.addEventListener("click", async function() {

    if (!videoFile) {

        alert("Сначала добавь видео.");

        return;
    }

    const start = Number(startTimeInput.value);
    const end = Number(endTimeInput.value);

    if (start >= end) {

        alert("Проверь время начала и конца.");

        return;
    }

    if (!videoPlayer.captureStream) {

        alert(
            "Экспорт пока не поддерживается этим браузером."
        );

        return;
    }

    try {

        status.textContent = "Экспорт видео... ⏳";

        const stream = videoPlayer.captureStream();

        const recorder = new MediaRecorder(stream, {
            mimeType: "video/webm"
        });

        const chunks = [];

        recorder.ondataavailable = function(event) {

            if (event.data.size > 0) {
                chunks.push(event.data);
            }

        };

        recorder.onstop = function() {

            const blob = new Blob(chunks, {
                type: "video/webm"
            });

            const url = URL.createObjectURL(blob);

            const link = document.createElement("a");

            link.href = url;
            link.download = "AlexCut-video.webm";

            document.body.appendChild(link);

            link.click();

            link.remove();

            setTimeout(function() {
                URL.revokeObjectURL(url);
            }, 1000);

            status.textContent = "Видео сохранено ✅";

            alert("✅ Видео сохранено!");

        };

        videoPlayer.currentTime = start;

        await new Promise(function(resolve) {

            function seeked() {

                videoPlayer.removeEventListener(
                    "seeked",
                    seeked
                );

                resolve();

            }

            videoPlayer.addEventListener(
                "seeked",
                seeked
            );

        });

        recorder.start();

        await videoPlayer.play();

        setTimeout(function() {

            videoPlayer.pause();

            if (recorder.state !== "inactive") {
                recorder.stop();
            }

            playButton.textContent = "▶️ Воспроизвести";

        }, (end - start) * 1000);

    } catch (error) {

        console.error(error);

        status.textContent = "Ошибка экспорта ❌";

        alert(
            "❌ Не удалось экспортировать видео."
        );

    }

});

videoPlayer.addEventListener("play", function() {
    playButton.textContent = "⏸️ Пауза";
});

videoPlayer.addEventListener("pause", function() {
    playButton.textContent = "▶️ Воспроизвести";
});

</script>

</body>
</html>
